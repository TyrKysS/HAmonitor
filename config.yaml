name: "HA Monitor"
description: "Monitors state changes of all entities and logs them to a CSV file for easy export and annotation."
version: "1.0.0"
slug: "ha_monitor"
url: "https://github.com/your-repo/ha_monitor"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
hassio_api: true
map:
  - share:rw
options:
  domains:
    - sensor
    - binary_sensor
    - switch
    - light
    - climate
    - cover
    - lock
    - alarm_control_panel
    - media_player
    - input_boolean
    - input_select
    - input_number
  output_dir: "/share/ha_monitor"
  log_to_stdout: true
schema:
  domains:
    - str
  output_dir: str
  log_to_stdout: bool
